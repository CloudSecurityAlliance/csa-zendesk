name: controls

# The controls this project's release depends on live in GitHub's and PyPI's settings,
# not in this tree: the Trusted Publisher binding constrained to the `pypi` environment,
# that environment still requiring a reviewer, and branch protection on `main`. None of
# them appears in a diff, no test covers them, and a green CI run says nothing about
# whether they are still on - so a weekly run asks.
#
# `--strict` here and NOT on the release path: nobody is watching this run, so
# "could not verify" must fail rather than pass quietly. On the release path the same
# script runs without --strict, because an outage must not redden a release.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # set -o pipefail is load-bearing with the tee below: without it the step takes
      # tee's exit status and passes however the script exited. csa-google-workspace's
      # equivalent silently always-passed for exactly this reason (its #316) - the
      # checker failing the way the thing it checks fails.
      - name: Assert the externally-enforced controls
        run: |
          set -o pipefail
          python scripts/check_controls.py --strict | tee -a "$GITHUB_STEP_SUMMARY"
