name: tests
on: [push, pull_request]

# Declared at workflow level so every job inherits it, rather than per-job on the one
# CodeQL happened to flag. Without this block each job takes the REPOSITORY default,
# which can be read-write - so a compromised step in any of them could push to the
# repo. Nothing here needs more than read: the jobs check out, install, and run
# gates. `release.yml` scopes `id-token: write` to its publish job alone and states
# `contents: read` at the top for the same reason.
#
# Found by CodeQL (actions/missing-workflow-permissions) on the PR that added the
# `security` job. It had been true of lint/test/gates since this file was written -
# the new job did not introduce it, it made it visible.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev,server]"
      # `.` not a list of directory names: `ruff check src tests scripts` left
      # experiments/ - tracked, and the live-walkthrough path - silently unlinted,
      # hiding a NameError in all three write scripts. Anything to skip goes in
      # pyproject's exclude/per-file-ignores, where it is reviewable.
      - run: ruff check .
      # Formatting is gated on the shipped package and its tests only. scripts/ is
      # excluded deliberately: check_public_safe.py is the publication gate, its
      # regexes and STRUCTURAL table are hand-aligned for readability, and CLAUDE.md
      # requires re-mutation-testing that guard after any change to its patterns.
      # Reformatting it would mean re-verifying a safety-critical file for cosmetics.
      - run: ruff format --check src tests
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev,server]"
      # 100, not 90: a gate ten points below a measured 100% cannot fail. The
      # sanctioned hatch is `# pragma: no cover` on a specific line, documented there.
      - run: python -m pytest -q --cov=csa_zendesk --cov-report=term-missing --cov-fail-under=100

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      # The publication gate runs with STRUCTURAL patterns only in CI - the tenant
      # term list is gitignored and absent here. It reports reduced coverage rather
      # than a false pass, which is the intended behaviour.
      - run: python3 scripts/check_public_safe.py
      - run: python3 scripts/check_spec.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.12" }
      # Deliberately unpinned: the point is to observe what a real `pip install
      # csa-zendesk` resolves to today, not what a pinned closure nobody installs
      # resolves to. The same gate runs on the release path, because a CVE disclosed
      # after the last merge would otherwise ship.
      - run: pip install -e ".[dev,server]" pip-audit bandit
      - run: pip-audit --skip-editable
      - run: bandit -r src
