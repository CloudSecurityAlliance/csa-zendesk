[build-system]
# 77, not 68: PEP 639's license-expression support (`license = "Apache-2.0"` above,
# rather than a classifier or a table) needs setuptools>=77. 68 understated it.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "csa-zendesk"
description = "Python library and local stdio MCP server over the Zendesk REST API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "Cloud Security Alliance" }]
keywords = ["zendesk", "mcp", "model-context-protocol", "support", "help-center"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
# httpx, not requests: the sibling projects use it and it gives us one client type
# for sync now and async later without a second dependency.
dependencies = ["httpx>=0.27"]

# A door into OAuth, not a product: `auth login` / `auth whoami` / `auth status`
# only. See `src/csa_zendesk/cli.py`. `csa-zendesk-mcp` is the separate stdio
# MCP server entry point (`src/csa_zendesk/server.py`).
[project.scripts]
csa-zendesk = "csa_zendesk.cli:main"
csa-zendesk-mcp = "csa_zendesk.server:main"

[project.optional-dependencies]
# mcp is NOT optional in the sibling project csa-skilljar - it was demoted to a
# required dependency there because an optional extra meant users installed the
# package and found no server. Revisit when the server module exists.
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6"]
# server.py imports `mcp` at module scope, so the library stays importable
# without it (`dependencies` above has no MCP SDK) while the server extra pulls
# it in. tests/test_public_api.py's import-time stdout guard imports every
# module in the package, including server.py - so the dev environment needs
# this extra installed too, not just a deployed server.
#
# Floor is 2.2, not 1.0: verified live that mcp 1.x and 2.x are a real
# incompatibility here, not conservative pinning. server.py's Server is built
# via 2.x's callback constructor (Server(name, on_list_tools=..., on_call_tool=...)),
# not 1.x's @server.list_tools()/@server.call_tool() decorators, and 2.x's
# Tool/ToolAnnotations/CallToolResult are pydantic models whose real attributes
# are snake_case (read_only_hint, destructive_hint, is_error) - 1.x's camelCase
# (readOnlyHint, isError) only survives as a construction alias, so code written
# against 2.x imports fine under 1.x and then fails on attribute access, with a
# traceback that points at our code, not at the dependency solve. Ceiling below
# 3 for the same reason a floor exists at all: this is a claim about what we
# actually work with, not a wildcard.
server = ["mcp>=2.2,<3"]

[project.urls]
Homepage = "https://github.com/CloudSecurityAlliance/csa-zendesk"
Issues = "https://github.com/CloudSecurityAlliance/csa-zendesk/issues"

[tool.setuptools.dynamic]
version = { attr = "csa_zendesk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
# T20 (flake8-print) is here for one reason: this is a stdio MCP server, so stdout
# is the protocol channel and a single stray `print` corrupts the session. The
# runtime guard in tests/test_public_api.py can only observe output at IMPORT time;
# a `print` inside a function is invisible to it and fires in production instead.
# Static analysis catches both, which makes this the stronger of the two guards -
# they are kept together because neither subsumes the other (T20 cannot see a write
# through `sys.stdout`, which the runtime guard can).
select = ["E", "F", "W", "I", "B", "UP", "T20"]
# E702 is deliberately ignored in the sibling repos - one-line `a = ...; b = ...`
# is house style there. Adopted here for consistency.
ignore = ["E702"]

[tool.ruff.lint.per-file-ignores]
# scripts/ are operator-facing CLIs whose entire output contract is stdout. The
# stdout prohibition binds the PACKAGE, which is what gets imported into an MCP
# server; it was never meant to bind the tooling around it.
"scripts/*" = ["T20"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# An unclosed httpx.Client or any other warning becomes a failure instead of
# silent output a stdio MCP server can't afford to print anyway.
filterwarnings = ["error"]

[tool.coverage.report]
# 100, not the 90 this once was: a gate ten points below a measured 100% cannot
# fail. The one sanctioned hatch is `# pragma: no cover` on a specific line, with
# a comment there saying why - never lowering this number back down.
fail_under = 100
